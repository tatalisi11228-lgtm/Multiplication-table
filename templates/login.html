<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOVA BANK | Login</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e5ec, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .login-container {
            perspective: 1200px;
        }

        .login-box {
            background: #f0f0f3;
            border-radius: 25px;
            width: 360px;
            padding: 40px 30px;
            box-shadow:
                9px 9px 16px #bebebe,
                -9px -9px 16px #ffffff;
            transition: transform 0.5s ease,
                box-shadow 0.5s ease,
                background 0.5s ease;
        }

        .login-box:hover {
            box-shadow:
                15px 15px 30px #b0b0b0,
                -15px -15px 30px #ffffff;
            background: linear-gradient(145deg, #f5f7fa, #e0e5ec);
        }

        .login-box h2 {
            color: #444;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #777;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 15px;
            border: none;
            background: #e0e5ec;
            box-shadow:
                inset 6px 6px 8px #bebebe,
                inset -6px -6px 8px #ffffff;
            font-size: 16px;
            color: #333;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .input-group input:focus {
            box-shadow:
                inset 4px 4px 6px #a8a8a8,
                inset -4px -4px 6px #ffffff;
        }

        .login-btn {
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 20px;
            background: linear-gradient(145deg, #6c8df5, #4669f7);
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            box-shadow:
                4px 4px 10px #3650b3,
                -4px -4px 10px #7a9fff;
            transition: transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                6px 6px 14px #2b3f94,
                -6px -6px 14px #8db1ff;
        }

        .error {
            color: #d93030;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 10px;
            padding: 8px;
        }

        @media (max-width: 400px) {
            .login-box {
                width: 90vw;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h2>ورود به حساب</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/" name="loginForm">

                <div class="input-group">

                    <label for="username">نام کاربری</label>
                    <input type="text" name="username" id="username"
                        placeholder="نام کاربری را وارد کنید" required>

                </div>

                <div class="input-group">

                    <label for="password">رمز عبور</label>

                    <input type="password" name="password" id="password" placeholder="رمز عبور را وارد کنید" required>

                </div>

                <button type="submit" class="login-btn">
                    ورود
                </button>

            </form>

        </div>

    </div>

    <script>

        // Enter in username moves focus to password
        document.getElementById("username").addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    document.getElementById("password").focus();

                }

            }
        );

    </script>

</body>

</html>
